<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakou Studio — Live Radio</title>
    <link rel="stylesheet" href="./studio.css" />
  </head>
  <body class="studio-body">
    <header class="studio-top">
      <p class="tag">Studio Radio</p>
      <div class="studio-top__actions">
        <span id="studio-user" class="studio-user"></span>
        <button type="button" id="studio-logout" class="studio-btn studio-btn--ghost">
          Déconnexion
        </button>
      </div>
    </header>

    <main class="studio-card studio-card--wide">
      <h1>Diffuser vers la Radio</h1>
      <p>
        Partage ton écran (+ son) : le flux part en WHIP vers le serveur, puis
        s’affiche en direct sur
        <a href="https://hakou.be/#radio" target="_blank" rel="noopener noreferrer"
          >hakou.be → Radio</a
        >
        pour tous les visiteurs (HLS).
      </p>

      <div class="studio-preview">
        <video id="studio-preview" playsinline muted autoplay></video>
        <p id="studio-preview-empty" class="studio-preview__empty">
          Aucun flux — lance « Passer en direct ».
        </p>
      </div>

      <div class="studio-actions">
        <button type="button" id="studio-start" class="studio-btn studio-btn--primary">
          Passer en direct
        </button>
        <button type="button" id="studio-stop" class="studio-btn studio-btn--ghost" disabled>
          Couper l’antenne
        </button>
      </div>
      <p id="studio-status" class="muted" role="status"></p>
    </main>

    <script type="module" src="./studio.js"></script>
  </body>
</html>
