<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakou Studio — Live Stream</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./studio.css?v=20260920aj" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="studio-body">
    <canvas id="studio-space" width="1280" height="720" aria-label="Système solaire"></canvas>
    <div class="studio-hud">
      <span id="studio-rec-badge" class="studio-rec-badge" hidden>REC</span>
      <span id="studio-audio-badge" class="studio-audio-badge" hidden></span>
    </div>
    <header class="studio-top">
      <p class="tag">Studio</p>
      <div class="studio-top__actions">
        <span id="studio-user" class="studio-user"></span>
        <button type="button" id="studio-logout" class="studio-btn studio-btn--ghost">
          Déconnexion
        </button>
      </div>
    </header>

    <div class="studio-stage" aria-hidden="true"></div>

    <main class="studio-dock">
      <div
        class="studio-belts"
        id="studio-belts"
        role="radiogroup"
        aria-label="Point de vue"
      ></div>

      <section class="studio-mix" aria-label="Mix">
        <p class="studio-dest__hint" id="studio-audio-hint">
          Partage l’écran et coche « Partager l’audio ». L’image ne part pas.
        </p>
        <button type="button" id="studio-audio-unlock" class="studio-btn studio-btn--ghost">
          Partager l’écran
        </button>
        <div class="studio-meter" id="studio-meter" data-signal="off">
          <span class="studio-meter__fill" id="studio-meter-fill"></span>
        </div>
        <p class="studio-meter__label" id="studio-meter-label">Pas de signal</p>
      </section>

      <div class="studio-transport" id="studio-transport" hidden>
        <div class="studio-transport__meta">
          <span id="studio-rec-state" class="studio-rec-state">REC</span>
          <time id="studio-chrono" class="studio-chrono" datetime="PT0S">00:00:00</time>
        </div>
        <div
          class="studio-timeline"
          id="studio-timeline"
          role="meter"
          aria-label="Durée"
          aria-valuemin="0"
          aria-valuenow="0"
          aria-valuetext="0 secondes"
        >
          <div class="studio-timeline__track">
            <div class="studio-timeline__fill" id="studio-timeline-fill"></div>
            <div class="studio-timeline__marks" id="studio-timeline-marks"></div>
            <div class="studio-timeline__head" id="studio-timeline-head"></div>
          </div>
          <div class="studio-timeline__ticks" id="studio-timeline-ticks"></div>
        </div>
        <div class="studio-transport__actions">
          <button type="button" id="studio-rec-pause" class="studio-btn studio-btn--ghost" disabled>
            Pause
          </button>
          <button type="button" id="studio-rec-stop" class="studio-btn studio-btn--ghost" disabled>
            Stop
          </button>
        </div>
      </div>

      <div class="studio-actions">
        <button type="button" id="studio-start" class="studio-btn studio-btn--primary">
          En direct
        </button>
        <button type="button" id="studio-stop" class="studio-btn studio-btn--ghost" disabled>
          Stop
        </button>
        <button type="button" id="studio-rec-start" class="studio-btn studio-btn--record">
          Rec
        </button>
      </div>
          <p id="studio-status" class="muted" role="status"></p>
      <div id="studio-listen-code" class="studio-listen-code" hidden>
        <p class="studio-listen-code__label">Code spectateurs</p>
        <p id="studio-listen-code-value" class="studio-listen-code__value"></p>
        <button type="button" id="studio-listen-copy" class="studio-btn studio-btn--ghost">
          Copier
        </button>
      </div>

      <details class="studio-fold" id="studio-plus">
        <summary>YouTube, Twitch, extra</summary>
        <div class="studio-dock__row">
          <fieldset class="studio-dest" id="studio-dest">
            <legend>Relais</legend>
            <label class="studio-dest__opt">
              <input type="radio" name="studio-dest" value="hakou" checked />
              Hakou seul
            </label>
            <label class="studio-dest__opt" id="studio-dest-youtube-label">
              <input type="radio" name="studio-dest" value="youtube" disabled />
              YouTube
            </label>
            <label class="studio-dest__opt" id="studio-dest-twitch-label">
              <input type="radio" name="studio-dest" value="twitch" disabled />
              Twitch
            </label>
          </fieldset>
        </div>
      </details>

      <details class="studio-fold" id="studio-accounts">
        <summary>Comptes</summary>
        <div class="studio-accounts__grid">
          <article class="studio-account" id="studio-account-youtube">
            <h3>YouTube</h3>
            <p id="studio-yt-status" class="studio-account__status muted">—</p>
            <p id="studio-yt-help" class="studio-account__help muted" hidden></p>
            <div class="studio-account__actions">
              <a class="studio-btn studio-btn--primary studio-btn--tiny" id="studio-yt-connect" hidden href="./api/studio/youtube/connect">
                Connecter
              </a>
              <button type="button" id="studio-yt-disconnect" class="studio-btn studio-btn--ghost studio-btn--tiny" hidden>
                Déconnecter
              </button>
              <button type="button" id="studio-yt-copy-uri" class="studio-btn studio-btn--ghost studio-btn--tiny" hidden>
                Copier URI
              </button>
            </div>
          </article>
          <article class="studio-account" id="studio-account-twitch">
            <h3>Twitch</h3>
            <p id="studio-tw-status" class="studio-account__status muted">—</p>
            <p id="studio-tw-result" class="studio-account__result" hidden role="status"></p>
            <div class="studio-account__actions">
              <a class="studio-btn studio-btn--primary studio-btn--tiny" id="studio-tw-connect" hidden href="./api/studio/twitch/connect">
                Connecter
              </a>
              <button type="button" id="studio-tw-disconnect" class="studio-btn studio-btn--ghost studio-btn--tiny" hidden>
                Déconnecter
              </button>
            </div>
            <form id="studio-tw-key-form" class="studio-account__key" action="#studio-accounts" method="post">
              <label for="studio-tw-key">Clé stream</label>
              <div class="studio-account__key-row">
                <input
                  id="studio-tw-key"
                  name="streamKey"
                  type="password"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="live_…"
                />
                <button type="button" id="studio-tw-key-save" class="studio-btn studio-btn--ghost studio-btn--tiny">
                  Sauver
                </button>
              </div>
            </form>
          </article>
        </div>
      </details>

      <details class="studio-fold studio-recordings">
        <summary>Enregistrements</summary>
        <ul id="studio-recordings-list" class="studio-recordings__list"></ul>
      </details>
    </main>

    <script type="module" src="./studio.js?v=20260920aj"></script>
  </body>
</html>
